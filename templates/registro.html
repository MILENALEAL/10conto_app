<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Finanças</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="tela-central">
        <div class="caixa-login">
            <h2>Criar Nova Conta</h2>
            <form method="POST" action="/registro">
                <input type="text" name="usuario" placeholder="Escolha um Usuário" required>
                <input type="password" name="senha" placeholder="Escolha uma Senha" required>
                <button type="submit">Cadastrar</button>
            </form>
            <br><br>
            <a href="/" class="link-simples">Já tenho conta (Fazer Login)</a>
        </div>
    </div>
</body>
</html>
