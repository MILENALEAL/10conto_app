<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>10Conto - Criar Conta</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png', v='2') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png', v='2') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="margin-bottom: 1.5rem; text-align: center;">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px;">
                <h1 style="font-size: 2rem; color: var(--text-main); margin-bottom: 5px;">
                    Nova Conta
                </h1>
                <p style="color: var(--text-dim); font-size: 0.95rem; font-weight: 400;">
                    Comece a organizar seu dinheiro.
                </p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                  {% for message in messages %}
                    <p class="flash-msg" style="color: var(--danger); font-size: 0.9rem; margin-bottom: 1rem;"><b>{{ message }}</b></p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" action="/registro">
                <div class="auth-fields-stack">
                    <div class="input-group-auth">
                        <input type="text" name="usuario" placeholder="Escolha um Usuário" required autocomplete="off">
                    </div>
                    <div class="input-group-auth">
                        <input type="password" name="senha" placeholder="Crie uma Senha" required>
                    </div>
                    
                    <button type="submit" class="btn-enviar" style="margin-top: 10px;">
                        Cadastrar
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <a href="/login" class="auth-link" style="margin-top: 1.5rem;">Já tenho conta (Fazer Login)</a>
            </div>
        </div>
        <p style="text-align: center; color: var(--text-dim); opacity: 0.5; font-size: 0.75rem; margin-top: 1.5rem; letter-spacing: 0.5px;">
            Desenvolvido por Milena Leal • Versão 3.0
        </p>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        }
    </script>
</body>
</html>
